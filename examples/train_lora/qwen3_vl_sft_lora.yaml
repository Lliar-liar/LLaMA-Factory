### model
model_name_or_path: Qwen/Qwen3-VL-8B-Instruct
image_max_pixels: 2250000
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_target: all
deepspeed: examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: abhuman_anomaly,had_anomaly,cocohuman_normal
# mix_strategy: interleave_under
# interleave_probs: 0.98,0.02  
template: qwen3_vl
cutoff_len: 16000
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 64
dataloader_num_workers: 64

### output
output_dir: /blob/Qwen_abhuman/qwen3vl-8b/v4/batch_32
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb                 
run_name: qwen3vl_8b_abhuman_v4  


### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 2.0e-4
num_train_epochs: 5.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.05                    
per_device_eval_batch_size: 8    
eval_strategy: steps               
eval_steps: 500            